<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tapo PTZ Control</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="viewer-shell">
    <section class="viewer-stage" aria-label="Live camera stream">
      <img class="stream-view" id="stream-view" alt="Live camera stream">

      <section class="control-cluster control-cluster-left" aria-label="Tap controls">
        <div class="control-pad">
          <button class="control-button control-button-step direction-up" data-action="step" data-direction="up" aria-label="Tap up" type="button">
            <span class="glyph glyph-arrow">&#9651;</span>
          </button>
          <button class="control-button control-button-step direction-left" data-action="step" data-direction="left" aria-label="Tap left" type="button">
            <span class="glyph glyph-arrow">&#9665;</span>
          </button>
          <button class="control-button control-button-step direction-right" data-action="step" data-direction="right" aria-label="Tap right" type="button">
            <span class="glyph glyph-arrow">&#9655;</span>
          </button>
          <button class="control-button control-button-step direction-down" data-action="step" data-direction="down" aria-label="Tap down" type="button">
            <span class="glyph glyph-arrow">&#9661;</span>
          </button>
        </div>
      </section>

      <section class="control-cluster control-cluster-right" aria-label="Extreme controls">
        <div class="control-pad">
          <button class="control-button control-button-extreme direction-up" data-action="extreme" data-direction="up" aria-label="Move up to the limit" type="button">
            <span class="glyph glyph-arrow">&#9650;</span>
          </button>
          <button class="control-button control-button-extreme direction-left" data-action="extreme" data-direction="left" aria-label="Move left to the limit" type="button">
            <span class="glyph glyph-arrow">&#9664;</span>
          </button>
          <button class="control-button control-button-extreme direction-right" data-action="extreme" data-direction="right" aria-label="Move right to the limit" type="button">
            <span class="glyph glyph-arrow">&#9654;</span>
          </button>
          <button class="control-button control-button-extreme direction-down" data-action="extreme" data-direction="down" aria-label="Move down to the limit" type="button">
            <span class="glyph glyph-arrow">&#9660;</span>
          </button>
        </div>
      </section>

      <section class="patrol-bar" aria-label="Patrol controls">
        <button class="patrol-button" data-patrol-axis="horizontal" type="button">Patrol H</button>
        <button class="patrol-button" data-patrol-axis="vertical" type="button">Patrol V</button>
        <button class="patrol-button patrol-button-stop" id="patrol-stop-button" type="button">Stop</button>
      </section>

      <p class="sr-only" id="stream-status" aria-live="polite">Connecting video...</p>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
